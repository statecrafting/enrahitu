# template.toml: the versioned contract between this template and the
# Statecraft factory (spec 009). The factory reads ONLY this file to learn
# how to stamp, verify, and package an app from this chassis; anything not
# expressed here is not part of the interface.

[template]
name = "enrahitu"
version = "0.2.0"
license = "Apache-2.0"

[contract]
# Contract schema version (semver). The factory pins a compatible range;
# a breaking change to this file's shape bumps the major. v0.2 added the
# optional [requires].toolchain key (spec 018); v0.3 added the [provenance]
# table (spec 012); v0.4 added the scaffold verb (spec 014); v0.5 added the
# react-rr7 frontend flavor (spec 015); v0.6 added the admin slot (spec 023).
# Each of those is a minor bump per spec 009 §3.1.
#
# v0.7 REMOVES the `frontend` slot (spec 015, the React-only convergence). Under
# a `^0.6` caret pin this is a BREAKING change, because at 0.x the minor is the
# breaking position: a factory that passes --frontend must stop. Spec 009 §3.1
# calls a removal a "major" bump; the literal 1.0.0 is reserved for declaring
# the contract stable, which this is not, so the break lands where a caret pin
# actually sees it.
version = "0.7.0"

[requires]
node = ">=24"
# The packaged build toolchain (statecrafting spec 002), consumed as a
# devDependency (@statecrafting/toolchain): the Encore build drivers, the
# app-model extractor, and prebuilt per-platform encore-runtime.node /
# tsparser-encore binaries. Its @statecrafting/hiqlite-native companion carries
# the prebuilt addon (statecrafting spec 003). The template and a stamped app
# consume the same published packages; neither builds Encore or the addon from
# source, so no Rust or protoc toolchain is required to build.
toolchain = "^0.3"

[slots]
# Values the factory substitutes at stamp time.
app_name = { required = true, pattern = "^[a-z][a-z0-9-]*$" }
org = { required = true }
# The `frontend` slot is GONE as of contract v0.7 (spec 015). It offered vue and
# react-rr7 as sibling flavor directories the scaffold verb pruned to one. The
# pivot makes enrahitu a membership platform that ships a working application
# rather than a shell to fill in, so the SPA carries the product's own screens
# and there is no framework left to choose: `frontend/` is React 19 + React
# Router v7, period. A slot with one value is not a knob, it is a lie about
# where the variation lives.
# admin (contract v0.6, spec 023): whether the stamped app carries the
# flag-gated operator dashboard (frontend-admin/ + backend/admin/, served
# same-origin under /admin, gated on the <app>_operator role). "off" prunes
# both directories; ADMIN_UI_ENABLED=false is the separate runtime kill
# switch where stamped on.
admin = { default = "on", allowed = ["on", "off"] }

[verbs]
# Commands the factory runs inside a stamped repo. Exit code is the verdict.
verify = "npm run typecheck && npm test"
package = "scripts/docker-build.sh"
# scaffold (contract v0.4, spec 014): the in-template stamping recipe. Run from
#   the repo root of a fresh clone to turn it into a named app: slot validation,
#   app-name substitution in the manifest and lockfile, provenance-cert
#   placement, derived-truth regeneration, and a README lineage marker. Required
#   flags: --app-name, --org; optional: --frontend, --cert, --stamped-from.
scaffold = "node scripts/stamp.mjs"
# deploy: owned by the Statecraft fleet service, never by the template.

[provenance]
# Born-with certificate + agentic-posture binding (spec 012, contract v0.3).
# The template owns the cert schema and its validator; the factory emits the
# instance at stamp time. cert_path exists only in stamped repos, never in the
# template itself. Kept out of the verify verb on purpose: cert validation is a
# provenance concern the factory invokes separately, since verify must also
# pass here, where there is no cert.
cert_path = ".statecraft/born-with.json"
cert_schema = ".statecraft/born-with.schema.json"
verify = "node scripts/verify-born-with.mjs"
postures = ["none", "assisted", "autonomous"]
